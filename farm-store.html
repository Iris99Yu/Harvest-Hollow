<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Harvest Hollow Shop</title><style>
*{box-sizing:border-box}body{margin:0;background:#87cdeb;font-family:"Avenir Next","Trebuchet MS",sans-serif;color:#553b2d;display:grid;place-items:center}.phone{width:min(100%,430px);min-height:100vh;padding:16px;background:linear-gradient(#8cd4ef,#cceef3 27%,#8ac457 27%);position:relative;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;color:#fff8d8;text-shadow:0 2px #438640}.back{width:43px;height:43px;border:0;border-radius:14px;background:#fff8df;color:#684733;font-size:23px;box-shadow:0 4px #be965b}.top h1{font-size:22px;margin:0}.coins{background:#fff8df;color:#62402e;text-shadow:none;border-radius:20px;padding:9px 13px;font-weight:900;box-shadow:0 4px #be965b}.coin{width:16px;height:16px;border-radius:50%;display:inline-block;background:#f5c94c;border:2px solid #fff2a4;vertical-align:-3px}.banner{margin:22px 4px 14px;padding:18px;border:4px solid #fff2bc;border-radius:23px;background:linear-gradient(135deg,#f89658,#ef655a);color:#fff8d4;box-shadow:0 6px #bc5148;text-align:left}.banner b{font-size:21px;display:block}.banner span{font-size:13px;font-weight:800}.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff6d9;border:4px solid #fff;border-radius:19px;padding:10px;box-shadow:0 5px rgba(78,107,45,.22)}.icon{width:56px;height:56px;border-radius:17px;background:#f4d161;display:grid;place-items:center;color:#8d5c34;font-size:30px;font-weight:1000}.item strong{font-size:15px}.item small{display:block;color:#8b6a51;font-weight:700;margin-top:3px;font-size:12px}.buy{border:0;border-radius:12px;padding:10px 9px;background:#59aa45;color:#fff;font-weight:900;box-shadow:0 4px #398331}.buy:active{transform:translateY(3px);box-shadow:0 1px #398331}.status{margin-top:17px;text-align:center;color:#fff7d4;font-size:13px;font-weight:900;text-shadow:0 2px #4c9144;min-height:20px}@media(min-width:431px){body{padding:16px}.phone{min-height:820px;border-radius:35px;box-shadow:0 18px 55px rgba(26,88,117,.38)}}
</style></head><body><main class="phone"><header class="top"><button class="back" onclick="location.href='farm-home.html'">‹</button><h1>FARM SHOP</h1><div class="coins"><i class="coin"></i> 250</div></header><section class="banner"><b>GO AD-FREE</b><span>Play without rewarded-ad interruptions.</span></section><section class="items"><article class="item"><div class="icon">AD</div><div><strong>Ad-Free Pass · 7 Days</strong><small>Removes ad prompts for one week.</small></div><button class="buy" data-item="Ad-Free Pass">$2.99</button></article><article class="item"><div class="icon">↻</div><div><strong>Shuffle Pack</strong><small>Five extra field shuffles.</small></div><button class="buy" data-item="Shuffle Pack">$0.99</button></article><article class="item"><div class="icon">C</div><div><strong>Collector Pack</strong><small>Five powerful collectors.</small></div><button class="buy" data-item="Collector Pack">$0.99</button></article><article class="item"><div class="icon">+</div><div><strong>Farm Coins</strong><small>1,000 coins for future upgrades.</small></div><button class="buy" data-item="Farm Coins">$1.99</button></article></section><div class="status" id="status"></div></main><script>const adButton=document.querySelector('[data-item="Ad-Free Pass"]');function refreshPass(){const until=Number(sessionStorage.getItem('farmAdFreeUntil')||0);if(until>Date.now()){adButton.textContent='ACTIVE';document.getElementById('status').textContent='Ad-Free Pass active until '+new Date(until).toLocaleDateString()}}refreshPass();document.querySelectorAll('.buy').forEach(button=>button.onclick=()=>{const item=button.dataset.item;if(item==='Ad-Free Pass'){const until=Date.now()+7*24*60*60*1000;sessionStorage.setItem('farmAdFreeUntil',String(until));refreshPass();return}document.getElementById('status').textContent=item+' added to your farm!';button.textContent='OWNED'});</script></body></html>
