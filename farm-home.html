<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Harvest Hollow</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#8bd2ee;font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif;color:#503426}.phone{width:min(100%,430px);min-height:100vh;overflow:hidden;position:relative;background:linear-gradient(#80cdef 0 33%,#d8f5fb 33% 40%,#8bca55 40%)}.cloud{position:absolute;width:104px;height:31px;border-radius:40px;background:#fff;opacity:.8;box-shadow:32px -14px #fff,64px -3px #fff;filter:drop-shadow(0 4px 1px #66b8d8)}.c1{top:11%;left:3%}.c2{top:23%;right:-8%;transform:scale(.72)}.barn{position:absolute;left:50%;top:44%;transform:translateX(-50%);width:245px;height:190px;border:6px solid #fff2c5;border-radius:18px 18px 34px 34px;background:#ef6f54;box-shadow:inset 0 -18px rgba(172,60,47,.18),0 11px rgba(49,113,45,.22)}.barn:before{content:"";position:absolute;left:50%;top:-91px;transform:translateX(-50%);width:305px;height:115px;background:#dc5149;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 -4px #fff0c3)}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:86px;height:105px;border:4px solid #f7d47e;border-bottom:0;border-radius:44px 44px 0 0;background:#70483b}.door:after{content:"★";position:absolute;left:29px;top:25px;color:#ffd657;font-size:30px}.logo{position:relative;margin-top:94px;text-align:center;font-weight:1000;font-size:45px;line-height:.78;color:#ed7259;letter-spacing:-3px;text-shadow:0 4px #fff,0 8px #bb5040}.logo span{display:block;color:#4e9c49;font-size:25px;letter-spacing:7px;text-shadow:0 2px #fff}.tagline{position:relative;margin-top:26px;text-align:center;color:#fff8d9;font-weight:900;text-shadow:0 2px #5b9848;font-size:15px;letter-spacing:.4px}.play{position:absolute;z-index:3;bottom:122px;left:34px;right:34px;height:62px;border:4px solid #fff4b7;border-radius:22px;background:linear-gradient(#ffdc63,#f39a39);box-shadow:0 6px #bf6927;color:#87420f;font:900 20px inherit;letter-spacing:.7px;text-decoration:none;display:grid;place-items:center}.play:active{transform:translateY(4px);box-shadow:0 2px #bf6927}.quick-links{position:absolute;z-index:3;bottom:73px;left:34px;right:34px;display:flex;gap:9px}.quick-links a{flex:1;text-align:center;text-decoration:none;border:2px solid #fff5c4;border-radius:15px;background:#fff6d7;box-shadow:0 4px #c8934f;padding:10px 3px;color:#75462d;font-size:13px;font-weight:900}.settings{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff8d8;font-size:13px;font-weight:800;text-shadow:0 2px #4b9045}@media(min-width:431px){body{padding:16px}.phone{min-height:820px;border-radius:35px;box-shadow:0 18px 55px rgba(26,88,117,.38)}}
</style>
<style>
.wallet{position:absolute;z-index:5;right:17px;top:18px;border:3px solid #fff4b9;border-radius:18px;background:#fff8dc;box-shadow:0 4px #ba9257;padding:7px 11px;color:#684431;font-size:13px;font-weight:1000}.wallet i{display:inline-block;width:14px;height:14px;border:2px solid #fff1a3;border-radius:50%;background:#f4c74b;vertical-align:-2px}.ops-panel{position:absolute;z-index:4;top:205px;left:22px;right:22px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.ops-card{min-height:93px;padding:11px;border:3px solid #fff5c7;border-radius:18px;background:#fff8df;box-shadow:0 5px rgba(68,116,46,.23);color:#6a4937}.ops-card strong{display:block;font-size:12px;color:#e36656}.ops-card small{display:block;margin-top:4px;font-size:10px;font-weight:800;line-height:1.2}.ops-card button{margin-top:7px;border:0;border-radius:9px;background:#59a848;color:#fff;padding:5px 8px;font:900 10px inherit;box-shadow:0 3px #3c8133}.ops-card button:disabled{background:#a7b698;box-shadow:none}.event-bar{position:absolute;z-index:4;top:319px;left:30px;right:30px;padding:7px;border-radius:12px;background:#e86b5c;color:#fff7d3;text-align:center;font-size:11px;font-weight:1000;box-shadow:0 3px #b74f47}
</style>
</head>
<body>
  <main class="phone" aria-label="Harvest Hollow home page">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="wallet"><i></i> <span id="homeCoins">250</span></div>
    <div class="logo">HARVEST<span>HOLLOW</span></div>
    <div class="tagline">MATCH FARM FAVORITES · CLEAR THE FIELD</div>
    <section class="ops-panel" aria-label="Daily game activities"><article class="ops-card"><strong>DAILY HARVEST</strong><small>Come back today for a coin boost.</small><button id="claimDaily">CLAIM +50</button></article><article class="ops-card"><strong>DAILY GOAL</strong><small>Make <span id="matchCount">0</span>/9 matches today.</small><button id="goalButton">KEEP PLAYING</button></article></section>
    <div class="event-bar">HARVEST WEEK · DOUBLE LEVEL REWARDS</div>
    <div class="barn"><div class="door"></div></div>
    <a class="play" href="farm-triple-match.html?level=1">PLAY NOW</a>
    <div class="quick-links"><a href="farm-battle.html">1V1 BATTLE</a><a href="farm-store.html">SHOP</a></div>
    <div class="settings">PRIVACY · SETTINGS</div>
  </main>
<script>
const storedCoins=Number(sessionStorage.getItem('farmCoins')||250);document.getElementById('homeCoins').textContent=storedCoins;const today=new Date().toDateString(),claim=document.getElementById('claimDaily');function addCoins(amount){const updated=Number(sessionStorage.getItem('farmCoins')||250)+amount;sessionStorage.setItem('farmCoins',updated);document.getElementById('homeCoins').textContent=updated}if(localStorage.getItem('farmDailyClaim')===today){claim.textContent='CLAIMED';claim.disabled=true}claim.onclick=()=>{addCoins(50);localStorage.setItem('farmDailyClaim',today);claim.textContent='CLAIMED';claim.disabled=true};const matches=localStorage.getItem('farmDailyMatchDate')===today?Number(localStorage.getItem('farmDailyMatches')||0):0,goal=document.getElementById('goalButton');document.getElementById('matchCount').textContent=Math.min(matches,9);if(matches>=9){if(localStorage.getItem('farmDailyGoalClaim')===today){goal.textContent='CLAIMED';goal.disabled=true}else{goal.textContent='CLAIM +100';goal.onclick=()=>{addCoins(100);localStorage.setItem('farmDailyGoalClaim',today);goal.textContent='CLAIMED';goal.disabled=true}}}else goal.onclick=()=>location.href='farm-triple-match.html?level=1';
</script></body>
</html>
